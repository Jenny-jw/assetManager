# Product branch: API + PostgreSQL (no MongoDB).
# Practice stack (not production). See docs/saas-ops.md.
# Prerequisites: copy .env.example → .env at repo root and fill in POSTGRES_* / JWT_*.
#   docker compose -f docker-compose.product.yml up --build -d

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOY_CONFIG_PATH: /app/deploy/config.yaml
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
    volumes:
      - ./deploy:/app/deploy:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
