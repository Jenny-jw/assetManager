name: Backend CI

on:
  push:
    branches: [product]
  pull_request:
    branches: [product]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run pytest
        env:
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          JWT_COOKIE_SECURE: "false"
        run: pytest -v

  compose-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=assetmanager_ci
          POSTGRES_PORT=5432
          JWT_SECRET_KEY=ci-compose-secret
          JWT_COOKIE_SECURE=false
          DEPLOY_CONFIG_PATH=deploy/config.yaml
          TRIAL_DAYS=90
          EOF

      - name: Start api and postgres
        run: docker compose -f docker-compose.product.yml up -d --build --wait --wait-timeout 180

      - name: Run Alembic migrations
        run: docker compose -f docker-compose.product.yml exec -T api alembic upgrade head

      - name: Smoke check health endpoints
        run: |
          set -euo pipefail
          for endpoint in health ready; do
            for attempt in $(seq 1 15); do
              if curl -fsS "http://localhost:8000/${endpoint}"; then
                echo
                break
              fi
              if [ "${attempt}" -eq 15 ]; then
                echo "::error::${endpoint} check failed after ${attempt} attempts"
                docker compose -f docker-compose.product.yml ps
                docker compose -f docker-compose.product.yml logs api --tail 100
                exit 1
              fi
              echo "Waiting for /${endpoint} (attempt ${attempt}/15)..."
              sleep 2
            done
          done

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.product.yml down -v
