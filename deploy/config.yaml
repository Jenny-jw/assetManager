# Active deployment config — personal edition default for product development.
# Canonical preset: deploy/presets/personal.yaml (keep in sync; tests enforce equality).
edition: personal
# First-visit UI default (zh-TW | en). Not a module; the chrome picker can change it anytime.
locale: zh-TW
roles_enabled:
  - owner
modules:
  inventory: true
  dashboard_summary: true
  dashboard_origin_chart: true
  dashboard_genre_chart: true
  dashboard_recent_assets: true
  orders: false
  order_notifications: false
  pricing_visibility: true
  profit_analytics: false
dashboard_layout:
  - summary
  - origin
  - genre
  - recent_assets